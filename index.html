<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emberleaf — Taste Autumn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="track"></div>
<div id="stage">
  <div id="bgSky"></div>
  <div id="bgField"></div>
  <div id="bgProd"></div>

  <h1 id="headline" class="hl-in"><span>TASTE</span><span>AUTUMN</span></h1>
  <div id="blends">BLENDS</div>
  <div id="mark">Emberleaf</div>

  <canvas id="dunes"></canvas>

  <canvas id="rose" class="spr"></canvas>
  <canvas id="tea" class="spr"></canvas>
  <canvas id="peel" class="spr"></canvas>
  <canvas id="cassia" class="spr"></canvas>
  <canvas id="amber" class="spr"></canvas>
  <canvas id="card" class="spr"></canvas>

  <div id="t_rose" class="lbl">ROSE</div>
  <div id="t_tea" class="lbl">TEA LEAVES</div>
  <div id="t_peel" class="lbl">ORANGE PEEL</div>
  <div id="t_cassia" class="lbl">CASSIA</div>
  <div id="t_amber" class="lbl">AMBER</div>
  <div id="t_card" class="lbl">CARDAMOM</div>

  <canvas id="drop" class="spr"></canvas>
  <div id="funnel" class="spr"><canvas id="funnelCv"></canvas></div>

  <canvas id="p_l" class="spr"></canvas>
  <canvas id="p_m" class="spr"></canvas>
  <canvas id="p_r" class="spr"></canvas>

  <canvas id="tin_l" class="spr"></canvas>
  <canvas id="tin_m" class="spr"></canvas>
  <canvas id="tin_r" class="spr"></canvas>

  <canvas id="lid_l" class="spr"></canvas>
  <canvas id="lid_m" class="spr"></canvas>
  <canvas id="lid_r" class="spr"></canvas>

  <canvas id="fl_l"></canvas>
  <canvas id="fl_r"></canvas>
</div>

<nav id="nav">
  <a href="#" class="brand">Emberleaf</a>
  <ul></ul>
</nav>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="script.js"></script>
</body>
</html>
